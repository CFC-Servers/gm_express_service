name: Build
on:
  push:
    branches:
      - main
  repository_dispatch:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        run: npm ci

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN }}
          preCommands: |
            # KV
            ## Create the namespace if it doesn't exist
            wrangler kv namespace list | grep -q GmodExpress || wrangler kv namespace create GmodExpress

            ## Get the namespace ID
            namespaceid=$(wrangler kv namespace list | jq '.[] | select(.title=="gmod-express-GmodExpress") | .id')

            ## Add the binding to the wrangler.toml
            echo "kv_namespaces = [ { binding = 'GmodExpress', id = $namespaceid } ]" >> wrangler.toml

            # R2
            ## Create the bucket if it doesn't exist
            wrangler r2 bucket list | grep -q "express-v1" || wrangler r2 bucket create express-v1
            echo "r2_buckets = [ { binding = 'ExpressV1Bucket', bucket_name = 'express-v1' } ]" >> wrangler.toml
